<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Supir Bus Unila</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#22c55e">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #0f172a; color: white; }
        .btn { padding: 20px 40px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; width: 80%; margin: 10px 0; }
        #btn-mulai { background: #22c55e; color: white; }
        #btn-selesai { background: #ef4444; color: white; }
        .info { background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; font-size: 13px; }
        #status { font-weight: bold; color: #e2e8f0; margin: 15px 0; }
    </style>
</head>
<body>

    <h2>🚍 Panel Supir Bus Unila</h2>
    <p>Kabinet Sinergi Juang</p>
    
    <div id="status">Status: Belum Aktif</div>

    <button id="btn-mulai" class="btn">🟢 MULAI NARIK</button>
    <button id="btn-selesai" class="btn">🔴 SELESAI NARIK</button>

    <div class="info">
        <b>SISTEM OTOMATIS:</b><br>
        - ID Armada tersimpan otomatis di HP ini.<br>
        - Layar boleh mati, GPS tetap aktif.<br>
        - Pastikan izin lokasi set ke "Selalu" (Always).
    </div>

    <!-- Script PWA & Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRhKpaJAuSH76woU88Ht1-0QrKDNSMYDc",
            authDomain: "bus-unila.firebaseapp.com",
            databaseURL: "https://bus-unila-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bus-unila",
            appId: "1:791999999257:web:3643fcbef541d4d283a988"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ====== 1. KUNCI IDENTITAS ARMADA (ANTI-STUCK) ======
        let namaArmada = localStorage.getItem("id_armada_supir");

        if (!namaArmada) {
            let inputArmada = prompt("Masukkan Nomor Armada Anda (Contoh: 4):");
            if (inputArmada) {
                namaArmada = "bus_" + inputArmada.trim();
                localStorage.setItem("id_armada_supir", namaArmada);
            } else {
                alert("Nomor armada wajib diisi!");
            }
        }

        let watchId = null;
        const statusDiv = document.getElementById("status");

        // ====== 2. TOMBOL MULAI NARIK ======
        document.getElementById("btn-mulai").addEventListener("click", () => {
            if (navigator.geolocation) {
                statusDiv.innerText = "Status: Memulai GPS...";
                statusDiv.style.color = "#22c55e";

                watchId = navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Kirim ke Firebase sesuai ID armada yang terkunci
                    set(ref(db, 'lokasi_bus/' + namaArmada), {
                        lat: lat,
                        lng: lng,
                        timestamp: Date.now()
                    });

                    statusDiv.innerText = `Status: Aktif (${namaArmada.replace('bus_', 'Armada ')})`;
                }, (error) => {
                    alert("Gagal mengambil GPS. Pastikan Izin Lokasi Aktif!");
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            } else {
                alert("HP tidak mendukung GPS.");
            }
        });

        // ====== 3. TOMBOL SELESAI NARIK (ANTI-STUCK) ======
        document.getElementById("btn-selesai").addEventListener("click", () => {
            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
            }
            
            // Hapus data di Firebase secara bersih menggunakan ID yang tersimpan
            remove(ref(db, 'lokasi_bus/' + namaArmada)).then(() => {
                statusDiv.innerText = "Status: Off (Data Bersih)";
                statusDiv.style.color = "#ef4444";
                alert("Status armada berhasil dinonaktifkan secara bersih!");
            }).catch((error) => {
                alert("Gagal menghapus data, coba lagi.");
            });
        });
    </script>
</body>
</html>
