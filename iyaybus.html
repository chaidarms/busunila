<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Supir Bus Unila</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#22c55e">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #0f172a; color: white; }
        .btn { padding: 18px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; width: 85%; margin: 8px 0; transition: all 0.2s; }
        #btn-mulai { background: #22c55e; color: white; display: none; }
        #btn-selesai { background: #ef4444; color: white; display: none; }
        
        /* Desain Pilihan Armada */
        .grid-armada { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 85%; margin: 15px auto; }
        .btn-bus { background: #1e293b; color: #94a3b8; border: 2px solid #334155; padding: 15px; font-size: 14px; font-weight: bold; border-radius: 10px; cursor: pointer; }
        .btn-bus.terpilih { background: #10b981; color: white; border-color: #34d399; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        
        .info { background: #1e293b; padding: 15px; border-radius: 10px; text-align: left; margin-top: 20px; font-size: 13px; border: 1px solid #334155; }
        #status { font-weight: bold; color: #cbd5e1; margin: 15px 0; background: #1e293b; padding: 10px; border-radius: 8px; display: inline-block; min-width: 200px; }
    </style>
</head>
<body>

    <h2>🚍 Panel Supir Bus Unila</h2>
    <p style="color: #94a3b8; margin-top: -10px;">Kabinet Sinergi Juang</p>
    
    <div id="status">Pilih Armada Anda Di Bawah</div>

    <!-- Menu Pilihan Tampilan Lama yang Kamu Mau -->
    <div id="panel-pilihan">
        <div class="grid-armada">
            <button class="btn-bus" onclick="pilihBus(1)">Armada 1</button>
            <button class="btn-bus" onclick="pilihBus(2)">Armada 2</button>
            <button class="btn-bus" onclick="pilihanBus(3)" style="display:none;">Armada 3</button> <!-- Cadangan -->
            <button class="btn-bus" onclick="pilihBus(4)">Armada 4</button>
            <button class="btn-bus" onclick="pilihBus(5)">Armada 5</button>
            <button class="btn-bus" onclick="pilihBus(6)">Armada 6</button>
            <button class="btn-bus" onclick="pilihBus(7)">Armada 7</button>
        </div>
    </div>

    <!-- Tombol Kontrol Utama -->
    <button id="btn-mulai" class="btn">🟢 MULAI TRANSMISI GPS</button>
    <button id="btn-selesai" class="btn">🔴 SELESAI & BERSIHKAN DATA</button>

    <div class="info">
        <b>SISTEM AUTO-SAVE:</b><br>
        - Pilih nomor bus, sistem langsung mengunci di HP.<br>
        - Jika aplikasi ter-close, cukup buka kembali dan langsung klik tombol <b>SELESAI</b> untuk reset *stuck* data.
    </div>

    <!-- Script Utama -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRhKpaJAuSH76woU88Ht1-0QrKDNSMYDc",
            authDomain: "bus-unila.firebaseapp.com",
            databaseURL: "https://bus-unila-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bus-unila",
            appId: "1:791999999257:web:3643fcbef541d4d283a988"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let idBusTerpilih = localStorage.getItem("save_id_bus");
        let watchId = null;

        const statusDiv = document.getElementById("status");
        const btnMulai = document.getElementById("btn-mulai");
        const btnSelesai = document.getElementById("btn-selesai");

        // Fungsi Global untuk memilih bus (Biar bisa diakses dari tombol HTML di atas)
        window.pilihBus = function(nomor) {
            if (watchId) return alert("Matikan pelacakan dulu sebelum mengganti armada!");
            
            idBusTerpilih = "bus_" + nomor;
            localStorage.setItem("save_id_bus", idBusTerpilih); // Kirim ke sistem save memori HP
            
            // Perbarui UI tombol yang aktif
            document.querySelectorAll('.btn-bus').forEach(btn => btn.classList.remove('terpilih'));
            event.target.classList.add('terpilih');
            
            statusDiv.innerText = `Terpilih: Armada ${nomor}`;
            btnMulai.style.display = "inline-block";
            btnSelesai.style.display = "inline-block";
        }

        // Cek apakah ada data armada yang tersimpan dari sesi sebelumnya
        if (idBusTerpilih) {
            statusDiv.innerText = `Melanjutkan Sesi: ${idBusTerpilih.replace('bus_', 'Armada ')}`;
            btnMulai.style.display = "inline-block";
            btnSelesai.style.display = "inline-block";
            
            // Beri warna hijau otomatis pada tombol yang tersimpan sebelumnya
            setTimeout(() => {
                const tombol = Array.from(document.querySelectorAll('.btn-bus'));
                const targetText = "Armada " + idBusTerpilih.replace('bus_', '');
                const tombolTepat = tombol.find(b => b.innerText === targetText);
                if (tombolTepat) tombolTepat.classList.add('terpilih');
            }, 300);
        }

        // AKSI TOMBOL MULAI
        btnMulai.addEventListener("click", () => {
            if (!idBusTerpilih) return alert("Silakan pilih nomor armada dulu!");

            if (navigator.geolocation) {
                statusDiv.innerText = "Status: Mencari Sinyal Satelit...";
                statusDiv.style.color = "#10b981";

                watchId = navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    set(ref(db, 'lokasi_bus/' + idBusTerpilih), {
                        lat: lat,
                        lng: lng,
                        timestamp: Date.now()
                    });

                    statusDiv.innerText = `Status: Live Tracking (${idBusTerpilih.replace('bus_', 'Armada ')})`;
                }, (error) => {
                    alert("GPS Eror. Harap Izinkan Lokasi di HP Anda!");
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 0
                });
            }
        });

        // AKSI TOMBOL SELESAI (SOLUSI BUG STUCK)
        btnSelesai.addEventListener("click", () => {
            if (!idBusTerpilih) return;

            if (watchId) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            // Hapus data langsung ke cabang bus yang sedang terkunci/aktif
            remove(ref(db, 'lokasi_bus/' + idBusTerpilih)).then(() => {
                statusDiv.innerText = `Sukses! Data ${idBusTerpilih.replace('bus_', 'Armada ')} Dihapus`;
                statusDiv.style.color = "#ef4444";
                
                // Reset visual pilihan tombol
                document.querySelectorAll('.btn-bus').forEach(btn => btn.classList.remove('terpilih'));
                localStorage.removeItem("save_id_bus");
                idBusTerpilih = null;
                
                btnMulai.style.display = "none";
                btnSelesai.style.display = "none";
                
                alert("Data di peta mahasiswa berhasil dibersihkan!");
            }).catch(() => {
                alert("Gagal koneksi server untuk menghapus data.");
            });
        });
    </script>
</body>
</html>
