<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Unila</title>
    <style>
        body { font-family: sans-serif; background: #facc15; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; width: 80%; text-align: center; }
        select, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; font-size: 1rem; }
        button { background: #1a2a6c; color: white; border: none; font-weight: bold; }
        .off { background: #e11d48 !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Driver Bus Unila 🚌</h2>
        <select id="pilihBus"></select>
        <button id="btnAction">MULAI JALAN</button>
        <p id="status">Status: Siap</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCRhKpaJAuSH76woU88Ht1-0QrKDNSMYDc",
            authDomain: "bus-unila.firebaseapp.com",
            databaseURL: "https://bus-unila-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "bus-unila",
            appId: "1:791999999257:web:3643fcbef541d4d283a988"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let watchId = null;
        const select = document.getElementById('pilihBus');
        const btn = document.getElementById('btnAction');

        // Update pilihan bus yang belum dipakai
        onValue(ref(db, 'lokasi_bus'), (snapshot) => {
            if (watchId) return;
            const used = snapshot.val() || {};
            select.innerHTML = "";
            for(let i=1; i<=7; i++){
                const id = "bus_0" + i;
                if(!used[id]){
                    let opt = document.createElement('option');
                    opt.value = id; opt.innerHTML = "Bus " + i;
                    select.appendChild(opt);
                }
            }
        });

        btn.onclick = function() {
            const id = select.value;
            const path = ref(db, 'lokasi_bus/' + id);

            if (!watchId) {
                watchId = navigator.geolocation.watchPosition((pos) => {
                    set(path, { lat: pos.coords.latitude, lng: pos.coords.longitude });
                    onDisconnect(path).remove(); // Jika HP mati/koneksi putus, hapus data
                    document.getElementById('status').innerText = "Status: ONLINE (" + id + ")";
                    btn.innerText = "MATIKAN / SELESAI";
                    btn.classList.add('off');
                    select.disabled = true;
                }, null, { enableHighAccuracy: true });
            } else {
                // Saat tombol "MATIKAN" diklik, hapus data dari Firebase
                set(path, null).then(() => {
                    location.reload(); 
                });
            }
        };
    </script>
</body>
</html>
